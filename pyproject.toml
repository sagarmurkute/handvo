[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "handvo"
version = "0.1.0"
description = "Hand-Tracking & Gesture Assistive and Augmentative Communication (AAC) System"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Sagar Murkute", email = "contactsagar.design@gmail.com" }
]
keywords = [
    "hand-tracking",
    "gesture-recognition",
    "aac",
    "accessibility",
    "mediapipe",
    "pyside6",
    "opencv",
    "assistive-technology"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Adaptive Technologies",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PySide6>=6.6.0",
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.9",
    "numpy>=1.26.0",
    "pyttsx3>=2.90",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

[project.scripts]
handvo = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
